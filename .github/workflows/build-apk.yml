# Android APK'sını GitHub bulutunda derler (Android Studio kurmadan).
# Her push'ta ve elle "Run workflow" ile çalışır.
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: DeepSeek anahtari (opsiyonel)
        run: echo "deepseekKey=${{ secrets.DEEPSEEK_API_KEY }}" >> local.properties

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle'ı hazırla
        uses: gradle/actions/setup-gradle@v3

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı çıktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: yasli-yardimci-debug
          path: app/build/outputs/apk/debug/app-debug.apk
